name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_BIBLI_MEDIA_BASE_URL: ${{ vars.PUBLIC_BIBLI_MEDIA_BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate BibliImg public media configuration
        run: |
          node --input-type=module <<'NODECHECK'
          const value = process.env.PUBLIC_BIBLI_MEDIA_BASE_URL?.trim() ?? "";

          if (!value) {
            throw new Error(
              "PUBLIC_BIBLI_MEDIA_BASE_URL no está configurada."
            );
          }

          const url = new URL(value);

          if (url.protocol !== "https:") {
            throw new Error(
              "PUBLIC_BIBLI_MEDIA_BASE_URL debe usar HTTPS."
            );
          }

          console.log("BibliImg public media configuration: PASS");
          NODECHECK

      - name: Validate and build site
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser QA
        run: npm run qa:ci

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
